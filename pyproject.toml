[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebrain"
version = "0.1.0"
description = "Compile a repository into a Brain: a durable, cited model of a software system for AI agents and humans."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "EnterpriseX Platform" }]
keywords = ["ai", "agents", "codebase", "knowledge-graph", "mcp", "sdlc", "legacy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]

# The deterministic core has no third-party dependencies, on purpose: P1 must
# build a Brain offline, on a locked-down machine, with no API key and no
# network. Optional extras arrive with the layers that genuinely need them.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
codebrain = "codebrain.cli:main"

[project.urls]
Homepage = "https://github.com/EnterpriseX-Platform/CodeBrain"
Source = "https://github.com/EnterpriseX-Platform/CodeBrain"

[tool.hatch.build.targets.wheel]
packages = ["codebrain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]
